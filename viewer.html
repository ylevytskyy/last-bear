<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Animation Viewer — Софія</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #111218;
        color: #f0f2f8;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #canvas-container {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 280px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: rgba(22, 24, 34, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        z-index: 10;
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(217, 38, 38, 0.2);
        color: #ff6b6b;
        border: 1px solid rgba(217, 38, 38, 0.4);
      }
      .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa0b4;
        margin-bottom: 6px;
      }
      .clips {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      button {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #f0f2f8;
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.15s ease;
        text-align: left;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      button.active {
        background: #d92626;
        border-color: #ff4d4d;
        color: #fff;
        font-weight: 600;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row button {
        flex: 1;
        text-align: center;
      }
      label.toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: #d6dae6;
        cursor: pointer;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #d92626;
      }
      .dropzone {
        border: 1px dashed rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: #a9b0c4;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .dropzone:hover,
      .dropzone.dragover {
        border-color: #ff4d4d;
        background: rgba(217, 38, 38, 0.1);
        color: #fff;
      }
      #status {
        font-size: 11px;
        color: #8f96ab;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <aside id="panel">
      <h1>
        <span>3D Viewer</span>
        <span class="badge">GLB</span>
      </h1>

      <div>
        <div class="section-title">Анімації (NLA)</div>
        <div id="clips" class="clips"></div>
      </div>

      <div>
        <div class="section-title">Керування</div>
        <div class="row" style="margin-bottom: 10px">
          <button id="btn-play" class="active">Пауза</button>
          <button id="btn-reset-cam">Скинути камеру</button>
        </div>
        <label class="toggle" style="margin-bottom: 4px">
          <span>Швидкість</span>
          <span id="speed-val">1.00x</span>
        </label>
        <input id="speed" type="range" min="0.1" max="2.0" step="0.05" value="1.0" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="section-title" style="margin-bottom: 0">Відображення</div>
        <label class="toggle">
          <span>Скелет (Bones)</span>
          <input id="toggle-skeleton" type="checkbox" />
        </label>
        <label class="toggle">
          <span>Сітка (Wireframe)</span>
          <input id="toggle-wireframe" type="checkbox" />
        </label>
        <label class="toggle">
          <span>Ключ у лапі</span>
          <input id="toggle-key" type="checkbox" />
        </label>
      </div>

      <div>
        <label class="dropzone" id="dropzone">
          Перетягніть сюди <b>.glb</b> або натисніть, щоб відкрити файл
          <input id="file-input" type="file" accept=".glb,.gltf" hidden />
        </label>
      </div>

      <div id="status">Завантаження /models/sofia.glb...</div>
    </aside>

    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
